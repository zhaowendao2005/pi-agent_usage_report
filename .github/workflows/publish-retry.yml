name: publish-retry

# Re-publish an already-built tag WITHOUT rebuilding.
#
# Use when the release workflow failed *after* the build jobs (npm outage, bad
# token, half-published platform packages). Binaries are pulled from the tag's
# existing release run, so the published bits stay identical to what was built.
#
#   gh workflow run publish-retry.yml -f tag=v0.2.0
#
# scripts/publish.mjs is idempotent: already-published packages are skipped.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. v0.2.0'
        required: true
      run_id:
        description: 'Optional: release.yml run id to reuse artifacts from (default: newest run for the tag commit)'
        required: false
      dry_run:
        description: 'npm publish --dry-run'
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TAG: ${{ github.event.inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: locate the release run that built this tag
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            SHA=$(git rev-parse "${TAG}^{commit}")
            # a tag push run has head_sha == the tagged commit; a workflow_dispatch run
            # has head_sha == the dispatched branch, so fall back to the newest run
            RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=20" \
              --jq "[.workflow_runs[] | select((.head_sha==\"${SHA}\") or (.display_title | test(\"$TAG\")))] | .[0].id // empty")
            if [ -z "$RUN_ID" ]; then
              RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=20" \
                --jq '.workflow_runs[0].id // empty')
            fi
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::no release.yml run found for ${TAG} — pass run_id explicitly"
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "reusing artifacts from run $RUN_ID"

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.run.outputs.run-id }}
          pattern: payload-*
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: check npm credentials
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is missing — Settings → Secrets and variables → Actions → New repository secret, name NPM_TOKEN (npm Automation token with 2FA bypass)"
            exit 1
          fi
          echo "npm user: $(npm whoami)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # binaries come from artifacts, the JS payload is rebuilt from the tag
      - name: build extension payload
        run: node scripts/build.mjs --extension-only

      - name: publish
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          node scripts/publish.mjs "${ARGS[@]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish GitHub Release (download fallback)
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — uploading missing assets"
            gh release upload "$TAG" dist/bin/*/pi-usage-monitor* --clobber
          else
            gh release create "$TAG" --title "$TAG" \
              --notes "See commit history for details." \
              dist/bin/*/pi-usage-monitor*
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
