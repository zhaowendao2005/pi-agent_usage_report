name: ci

# Fast feedback only: typecheck + frontend build + cargo check.
# Produces NO artifacts, publishes NOTHING. Releases live in release.yml.

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', '.github/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install (root)
        run: pnpm install --frozen-lockfile

      - name: install (frontend)
        run: npm --prefix src-tauri/src-web ci --no-audit --no-fund

      - name: typecheck (pi extension)
        run: pnpm typecheck

      - name: build (pi extension)
        run: npx tsc -p tsconfig.build.json

      - name: build (frontend)
        run: npm --prefix src-tauri/src-web run build

      - name: tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
