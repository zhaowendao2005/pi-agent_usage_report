[package]
name = "pi-usage-monitor"
version = "0.1.0"
description = "Pi Agent token usage dashboard"
authors = ["usage-report"]
edition = "2021"

[lib]
name = "pi_usage_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
chrono = "0.4"
serde_yaml = "0.9"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
